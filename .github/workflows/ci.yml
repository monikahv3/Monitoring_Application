name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          # Non-sensitive test-only config — no real secrets
          SECRET_KEY: ci-test-secret
          ADMIN_PASSWORD: ci-test-password
        run: pytest -q

      # Do not upload .env, *.db, or credential files as artifacts
